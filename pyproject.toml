[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "asl-check"
version = "0.1.0"
description = "ASL compiler — parse and verify Agent Specification Language files"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{name = "agents.archi"}]
keywords = ["ai", "agents", "security", "formal-verification", "specification"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Software Development :: Compilers",
]

[project.scripts]
asl-check = "asl_check.__main__:main"

[project.urls]
Homepage = "https://agents.archi"
Repository = "https://github.com/borjamoskv/asl-spec"
Specification = "https://github.com/borjamoskv/asl-spec/blob/main/ASL-SPEC-v1.0.md"

[tool.setuptools.packages.find]
include = ["asl_check*"]
